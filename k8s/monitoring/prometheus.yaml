---
# ═══════════════════════════════════════════════════════════════════════════════
# PROMETHEUS — pull-based metrics collection (edge-optimized)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s          # Edge: moderate interval to save resources
      evaluation_interval: 15s
      scrape_timeout: 10s

    # Alertmanager integration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    # Alert rules
    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # Kubernetes API server
      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Node exporter — disk, network, OS metrics
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # cAdvisor — container-level CPU and memory
      - job_name: cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # Kube state metrics — pod conditions, PVC status
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring:8080"]

      # Kubelet — volume stats (PVC I/O)
      - job_name: kubelet
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # Sentinel backend — self-monitoring
      - job_name: sentinel-backend
        static_configs:
          - targets: ["sentinel-backend.sentinel:8000"]
        metrics_path: /metrics

  rules.yml: |
    groups:
      - name: industrial-edge-alerts
        rules:
          # PVC write latency spike (root cause of cascade)
          - alert: PVCWriteLatencyHigh
            expr: |
              rate(node_disk_write_time_seconds_total{job="node-exporter"}[2m])
              / rate(node_disk_writes_completed_total{job="node-exporter"}[2m]) * 1000 > 20
            for: 1m
            labels:
              severity: warning
              team: industrial-ops
            annotations:
              summary: "PVC write latency elevated — cascade risk"
              description: "Disk {{ $labels.device }} write latency {{ $value | humanize }}ms. Historian may be causing downstream failures."

          - alert: PVCWriteLatencyCritical
            expr: |
              rate(node_disk_write_time_seconds_total{job="node-exporter"}[2m])
              / rate(node_disk_writes_completed_total{job="node-exporter"}[2m]) * 1000 > 60
            for: 30s
            labels:
              severity: critical
              team: industrial-ops
            annotations:
              summary: "CRITICAL: PVC write latency cascade detected"
              description: "Storage stress propagating upstream. Check historian → inference → sensor-ingestion chain."

          # ML inference CPU saturation
          - alert: MLInferenceCPUSaturated
            expr: |
              rate(container_cpu_usage_seconds_total{namespace="industrial",pod=~"ml-inference.*"}[2m])
              / on(pod) kube_pod_container_resource_limits{resource="cpu",namespace="industrial",pod=~"ml-inference.*"} > 0.85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "ML inference pod CPU saturated"

          # Sensor ingestion memory bloat
          - alert: SensorIngestionMemoryBloat
            expr: |
              container_memory_working_set_bytes{namespace="industrial",pod=~"sensor-ingestion.*"}
              / kube_pod_container_resource_limits{resource="memory",namespace="industrial",pod=~"sensor-ingestion.*"} > 0.80
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Sensor ingestion memory bloat — possible packet loss"

          # PVC disk capacity
          - alert: PVCDiskNearFull
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} at {{ $value | humanizePercentage }} — historian write failure imminent"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d    # Edge: limit storage
            - --storage.tsdb.retention.size=5GB
            - --web.enable-lifecycle
            - --web.enable-admin-api
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}   # Replace with PVC for production

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
